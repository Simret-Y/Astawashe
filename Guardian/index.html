<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello React</title>
    <style>
      /* Decorative SVG backdrop inserted into head for crisp rendering */
      .decor-svg { position: fixed; left: 12%; top: -120px; width: 680px; height: 680px; pointer-events: none; z-index: 0; opacity: 0.08 }
    </style>
  </head>
  <body>
    <svg class="decor-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-hidden>
      <defs>
        <radialGradient id="g1" cx="30%" cy="30%" r="50%"><stop offset="0%" stop-color="#7b5cff" stop-opacity="0.9" /><stop offset="100%" stop-color="#7b5cff" stop-opacity="0" /></radialGradient>
        <radialGradient id="g2" cx="70%" cy="70%" r="50%"><stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9" /><stop offset="100%" stop-color="#00f5ff" stop-opacity="0" /></radialGradient>
      </defs>
      <rect width="800" height="800" fill="url(#g1)" />
      <circle cx="620" cy="620" r="300" fill="url(#g2)" />
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
